[package]
name = "myprovenance"
version = "0.1.0"
edition = "2024"
description = "Proveniência de conjuntos de dados de pesquisa (W3C PROV), app desktop"
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "accesskit", "clipboard", "links"] }
egui = "0.37"
# Tabela com linhas virtualizadas (rolagem infinita na lista).
egui_extras = { version = "0.37", default-features = false }
egui_commonmark = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
garde = { version = "0.23", features = ["derive"] }
uuid = { version = "1", features = ["v7", "serde"] }
jiff = "0.2"
unicode-normalization = "0.1"
tempfile = "3"
directories = "6"
rfd = "0.17"
# Só na migração 3→4 do "Importar da v1…": descricao HTML (TipTap) → Markdown (ADR-0014).
htmd = "0.5"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
